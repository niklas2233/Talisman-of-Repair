name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Build Fabric
        working-directory: fabric
        run: ./gradlew build --console=plain

      - name: Build NeoForge
        working-directory: neoforge
        run: ./gradlew build --console=plain

      - name: Collect jars
        run: |
          mkdir -p release
          for loader in fabric neoforge; do
            jar=$(find "$loader/build/libs" -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar")
            cp "$jar" "release/talismanofrepair-${loader}-${GITHUB_REF_NAME}.jar"
          done
          ls -la release/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.jar
          generate_release_notes: true
